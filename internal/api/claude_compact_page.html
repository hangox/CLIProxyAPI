<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Compact</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10141b;color:#e8edf5}
body{margin:0;background:#10141b;color:#e8edf5}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:28px}.sub{color:#9ba8ba;margin-bottom:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{border:1px solid #3b4658;border-radius:7px;background:#1b2330;color:inherit;padding:8px 12px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}.card{background:#18202c;border:1px solid #2d3848;border-radius:10px;padding:13px}.label{font-size:12px;color:#9ba8ba;text-transform:uppercase;letter-spacing:.06em}.value{font-size:22px;font-weight:650;margin-top:6px;word-break:break-word}.ok{color:#65d391}.bad{color:#ff8e8e}.panel{background:#18202c;border:1px solid #2d3848;border-radius:10px;padding:16px;margin-top:14px}.panel h2{font-size:17px;margin:0 0 12px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #2d3848;white-space:nowrap}th{color:#9ba8ba;font-weight:600}.cause{white-space:normal;max-width:300px;overflow-wrap:anywhere}.muted{color:#9ba8ba}.status{margin-left:auto;color:#9ba8ba;font-size:13px}@media(max-width:600px){main{padding:15px}h1{font-size:23px}.value{font-size:19px}}
</style></head>
<body><main>
<h1>Claude Compact</h1><div class="sub">Local opaque compaction observability. History, markers, sessions, auth IDs, and paths are never displayed.</div>
<div class="toolbar"><label>Management key <input id="key" type="password" autocomplete="off" placeholder="Enter key"></label><button id="connect">Connect</button><button id="refresh">Refresh</button><label>Auto refresh <select id="interval"><option value="0">Off</option><option value="5000">5 seconds</option><option value="15000" selected>15 seconds</option><option value="60000">1 minute</option></select></label><span class="status" id="status">Loading…</span></div>
<section class="cards" id="cards"></section>
<section class="panel"><h2>Outcome metrics</h2><div class="cards" id="metrics"></div></section>
<section class="panel"><h2>Recent events</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Generation</th><th>Result</th><th>Cause</th><th>Duration</th><th>Upstream</th><th>Retry</th><th>Budget</th><th>Estimate</th><th>Trim</th><th>Image</th></tr></thead><tbody id="events"><tr><td colspan="11" class="muted">Loading…</td></tr></tbody></table></div><div class="toolbar"><button id="more">Load more</button><span class="muted" id="event-state"></span></div></section>
</main><script>
(() => {
 const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safe=v=>esc(v==null?'—':v), fmtBytes=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}, fmtTime=v=>v?new Date(v).toLocaleString():'—';
 let managementKey='', eventOffset=0, eventLimit=50, hasMore=true;
 const card=(label,value,cls='')=>`<div class="card"><div class="label">${safe(label)}</div><div class="value ${cls}">${safe(value)}</div></div>`;
 function authHeaders(){return managementKey?{'X-Management-Key':managementKey}:{} }
 function renderEvents(rows,append){const html=rows.map(x=>`<tr><td>${safe(fmtTime(x.time))}</td><td>${safe(x.generation)}</td><td>${safe(x.result)}</td><td class="cause">${safe(x.cause)}</td><td>${safe(x.duration_ms)} ms</td><td>${safe(x.upstream_ms)} ms</td><td>${safe(x.retry_count)}</td><td>${safe(x.budget)}</td><td>${safe(x.estimate)}</td><td>${safe(x.trim_count)}</td><td>${x.image?'Yes':'No'}</td></tr>`).join(''); if(append)$('events').insertAdjacentHTML('beforeend',html);else $('events').innerHTML=html||'<tr><td colspan="11" class="muted">No compact events yet.</td></tr>'; hasMore=rows.length===eventLimit;$('more').hidden=!hasMore;$('event-state').textContent=rows.length?`${rows.length} loaded`:'No events';}
 async function load(reset=true){if(!managementKey){$('status').textContent='Enter management key';return} if(reset){eventOffset=0;$('events').innerHTML='<tr><td colspan="11" class="muted">Loading…</td></tr>'} $('status').textContent='Loading…'; try{const headers=authHeaders();const [sr,er]=await Promise.all([fetch('/v0/management/claude-compact/status',{headers}),fetch(`/v0/management/claude-compact/events?limit=${eventLimit}&offset=${eventOffset}`,{headers})]);if(sr.status===401||er.status===401)throw new Error('management key rejected');if(!sr.ok||!er.ok)throw new Error('management request unavailable');const s=await sr.json(),e=await er.json(),ready=s.ready===true;$('cards').innerHTML=[card('Enabled',s.enabled?'Yes':'No',s.enabled?'ok':''),card('Ready',ready?'Yes':'No',ready?'ok':'bad'),card('Reason',s.reason||'—'),card('Protocol',s.protocol||'—'),card('States',s.state_count),card('Bytes',fmtBytes(s.state_bytes)),card('Oldest expiry',fmtTime(s.oldest_expiry)),card('Newest expiry',fmtTime(s.newest_expiry))].join('');const m=Object.assign({},s.metrics||{},s.outcomes||{});$('metrics').innerHTML=[card('Attempts',m.attempts||0),card('Successes',m.successes||0),card('Replays',m.replays||0),card('Restores',m.restores||m.restore_successes||0),card('Failures',m.failures||m.restore_failures||0),card('Budget exceeded',m.budget_exceeded||0),card('Latency avg',((m.latency_ms_avg||0)+' ms')),card('Latency max',((m.latency_ms_max||0)+' ms'))].join('');renderEvents(e.events||[],!reset);$('status').textContent='Updated '+new Date().toLocaleTimeString()}catch(err){$('status').textContent=err.message==='management key rejected'?'Management key rejected':'Unavailable';if(reset)$('cards').innerHTML=card('Ready','No','bad')}}
 function connect(){managementKey=$('key').value;$('key').value='';eventOffset=0;load(true)}
 let timer;function schedule(){clearInterval(timer);const n=Number($('interval').value);if(n)timer=setInterval(()=>load(true),n)} $('connect').onclick=connect;$('key').onkeydown=e=>{if(e.key==='Enter')connect()};$('refresh').onclick=()=>load(true);$('more').onclick=()=>{eventOffset+=eventLimit;load(false)};$('interval').onchange=schedule;$('more').hidden=true;$('status').textContent='Enter management key';schedule();
})();
</script></body></html>
