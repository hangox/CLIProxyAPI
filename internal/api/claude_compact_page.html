<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 压缩观测</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10141b;color:#e8edf5}body{margin:0;background:#10141b;color:#e8edf5}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:28px}.sub{color:#9ba8ba;margin-bottom:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select,input{border:1px solid #3b4658;border-radius:7px;background:#1b2330;color:inherit;padding:8px 12px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px}.card{background:#18202c;border:1px solid #2d3848;border-radius:10px;padding:13px}.label{font-size:12px;color:#9ba8ba;text-transform:uppercase;letter-spacing:.06em}.value{font-size:22px;font-weight:650;margin-top:6px;word-break:break-word}.ok{color:#65d391}.bad{color:#ff8e8e}.panel{background:#18202c;border:1px solid #2d3848;border-radius:10px;padding:16px;margin-top:14px}.panel h2{font-size:17px;margin:0 0 12px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #2d3848;white-space:nowrap}th{color:#9ba8ba;font-weight:600}.cause{white-space:normal;max-width:300px;overflow-wrap:anywhere}.muted{color:#9ba8ba}.status{margin-left:auto;color:#9ba8ba;font-size:13px}@media(max-width:600px){main{padding:15px}h1{font-size:23px}.value{font-size:19px}}
</style></head>
<body><main>
<h1>Claude 压缩观测</h1><div class="sub">查看本地 opaque 压缩的状态、性能和最近事件。页面绝不显示会话正文、marker、会话 ID、认证账号或文件路径。</div>
<div class="toolbar"><label>管理密钥 <input id="key" type="password" autocomplete="off" placeholder="输入管理密钥"></label><button id="connect">连接</button><button id="refresh">刷新</button><label>自动刷新 <select id="interval"><option value="0">关闭</option><option value="5000">5 秒</option><option value="15000" selected>15 秒</option><option value="60000">1 分钟</option></select></label><span class="status" id="status">请输入管理密钥</span></div>
<section class="cards" id="cards"></section>
<section class="panel"><h2>压缩结果指标</h2><div class="cards" id="metrics"></div></section>
<section class="panel"><h2>最近压缩事件</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>代数</th><th>结果</th><th>原因</th><th>总耗时</th><th>上游耗时</th><th>重试</th><th>预算</th><th>估算</th><th>裁剪</th><th>图片</th></tr></thead><tbody id="events"><tr><td colspan="11" class="muted">等待加载</td></tr></tbody></table></div><div class="toolbar"><button id="more">加载更多</button><span class="muted" id="event-state"></span></div></section>
</main><script>
(() => {
 const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safe=v=>esc(v==null?'—':v),fmtBytes=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'},fmtTime=v=>v?new Date(v).toLocaleString():'—';
 const resultText={success:'成功',replay:'幂等重放',restore:'恢复成功',restore_failure:'恢复失败',failure:'失败',budget_exceeded:'预算超限'},causeText={redacted:'已脱敏',unknown:'未知原因',invalid_marker:'无效标记',state_corrupt:'状态损坏',store_unavailable:'存储不可用',budget_exceeded:'预算超限',protocol_error:'协议错误',account_mismatch:'账号不匹配',session_mismatch:'会话不匹配',model_mismatch:'模型不匹配',variant_mismatch:'变体不匹配'};
 let managementKey='',eventOffset=0,eventLimit=50,hasMore=true;
 const card=(label,value,cls='')=>`<div class="card"><div class="label">${safe(label)}</div><div class="value ${cls}">${safe(value)}</div></div>`;
 function authHeaders(){return managementKey?{'X-Management-Key':managementKey}:{} }
 function renderEvents(rows,append){const html=rows.map(x=>`<tr><td>${safe(fmtTime(x.time))}</td><td>${safe(x.generation)}</td><td>${safe(resultText[x.result]||x.result)}</td><td class="cause">${safe(causeText[x.cause]||x.cause)}</td><td>${safe(x.duration_ms)} ms</td><td>${safe(x.upstream_ms)} ms</td><td>${safe(x.retry_count)}</td><td>${safe(x.budget)}</td><td>${safe(x.estimate)}</td><td>${safe(x.trim_count)}</td><td>${x.image?'是':'否'}</td></tr>`).join('');if(append)$('events').insertAdjacentHTML('beforeend',html);else $('events').innerHTML=html||'<tr><td colspan="11" class="muted">暂时没有压缩事件</td></tr>';hasMore=rows.length===eventLimit;$('more').hidden=!hasMore;$('event-state').textContent=rows.length?`已加载 ${eventOffset+rows.length} 条`:'暂时没有事件';}
 async function load(reset=true){if(!managementKey){$('status').textContent='请输入管理密钥';return}if(reset){eventOffset=0;$('events').innerHTML='<tr><td colspan="11" class="muted">加载中…</td></tr>'}$('status').textContent='加载中…';try{const headers=authHeaders();const[sr,er]=await Promise.all([fetch('/v0/management/claude-compact/status',{headers}),fetch(`/v0/management/claude-compact/events?limit=${eventLimit}&offset=${eventOffset}`,{headers})]);if(sr.status===401||er.status===401)throw new Error('management key rejected');if(!sr.ok||!er.ok)throw new Error('management request unavailable');const s=await sr.json(),e=await er.json(),ready=s.ready===true;$('cards').innerHTML=[card('已启用',s.enabled?'是':'否',s.enabled?'ok':''),card('就绪',ready?'是':'否',ready?'ok':'bad'),card('原因',s.reason||'—'),card('协议',s.protocol||'—'),card('状态数',s.state_count),card('占用空间',fmtBytes(s.state_bytes)),card('最早过期',fmtTime(s.oldest_expiry)),card('最晚过期',fmtTime(s.newest_expiry))].join('');const m=Object.assign({},s.metrics||{},s.outcomes||{});$('metrics').innerHTML=[card('压缩尝试',m.attempts||0),card('压缩成功',m.successes||0),card('幂等重放',m.replays||0),card('恢复成功',m.restores||m.restore_successes||0),card('失败',m.failures||m.restore_failures||0),card('预算超限',m.budget_exceeded||0),card('平均延迟',`${m.latency_ms_avg||0} ms`),card('最大延迟',`${m.latency_ms_max||0} ms`)].join('');renderEvents(e.events||[],!reset);$('status').textContent=`已更新 ${new Date().toLocaleTimeString()}`}catch(err){$('status').textContent=err.message==='management key rejected'?'管理密钥无效':'暂不可用';if(reset)$('cards').innerHTML=card('就绪','否','bad')}}
 function connect(){managementKey=$('key').value;$('key').value='';eventOffset=0;load(true)}
 let timer;function schedule(){clearInterval(timer);const n=Number($('interval').value);if(n)timer=setInterval(()=>load(true),n)}$('connect').onclick=connect;$('key').onkeydown=e=>{if(e.key==='Enter')connect()};$('refresh').onclick=()=>load(true);$('more').onclick=()=>{eventOffset+=eventLimit;load(false)};$('interval').onchange=schedule;$('more').hidden=true;$('status').textContent='请输入管理密钥';schedule();
})();
</script></body></html>
